[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hansard-llm"
version = "0.2.0"
description = "Hansard LLM topic-extraction pipeline: embedding retrieval + robustness-audited LLM extraction"
requires-python = ">=3.11"
# Pinned to the versions the pilot artifacts were produced with. duckdb is
# pinned hard: reservoir-sample REPEATABLE draws are only reproducible on the
# same duckdb version, so a silent upgrade would silently change every sample.
dependencies = [
    "openai~=2.50",
    "python-dotenv~=1.0",
    "pandas~=3.0",
    "pyarrow~=25.0",
    "duckdb==1.5.5",
    "numpy~=2.4",
    "scikit-learn~=1.9",
    "matplotlib~=3.10",
]

[project.optional-dependencies]
dev = ["pytest~=9.0"]
# Local embedding inference for the embedder grid (cluster or workstation).
# <5.6: 5.6 imports torchcodec, which needs FFmpeg >=6.1 (BMRC has 6.0).
embed = ["sentence-transformers>=5.0,<5.6", "torch"]

[tool.setuptools]
packages = ["hansard_llm", "hansard_llm.docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
